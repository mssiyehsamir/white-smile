@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1612;--sf:#12231c;--tx:#eaf4ef;--mu:#9ab3a7;--ln:#20382d;--g:#4fb683;--gs:#16301f;--no:#3a5247;--ok:#4fd39b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1612;--sf:#12231c;--tx:#eaf4ef;--mu:#9ab3a7;--ln:#20382d;--g:#4fb683;--gs:#16301f;--no:#3a5247;--ok:#4fd39b}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 "Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;gap:16px;height:76px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:24px;text-decoration:none;margin-inline-end:auto;letter-spacing:-.02em}
.brand i{width:44px;height:44px;border-radius:14px;background:var(--gs);display:grid;place-items:center}
.brand svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:2.2;stroke-linejoin:round}
.brand em{font-style:normal;color:var(--g)}
nav a{text-decoration:none;color:var(--mu);margin-inline:11px;font-size:15px;font-weight:500}
nav a:hover{color:var(--tx)}
.lang{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--tx);border-radius:99px;padding:6px 13px;font:600 13px "Readex Pro",sans-serif;cursor:pointer}
.lang button.on{background:var(--gs);color:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--g);color:#fff;border:0;border-radius:99px;padding:14px 30px;font:600 16px "Readex Pro",sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 10px 24px color-mix(in srgb,var(--g) 30%,transparent)}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.lang button:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-top:56px}
.eye{color:var(--g);font-weight:700;letter-spacing:.2em;font-size:14px;text-transform:uppercase;margin-bottom:22px}
h1{font-size:clamp(44px,6.4vw,84px);line-height:1.03;letter-spacing:-.04em;font-weight:700;margin:0 0 20px}
h1 span{display:block;background:linear-gradient(90deg,var(--g),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:.82em}
.role{font-size:22px;font-weight:600;margin:0 0 12px}
.hero p.d{color:var(--mu);font-size:19px;margin:0 0 30px;max-width:44ch}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.rate{display:flex;align-items:center;gap:10px;margin-top:34px;color:var(--mu);font-weight:500}
.stars{color:#f0a020;letter-spacing:3px;font-size:22px}
.photo{aspect-ratio:4/3.1;border-radius:34px;background:var(--ph) center/cover;box-shadow:0 30px 60px rgba(15,60,40,.18)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:26px 14px;text-align:center}
.stats b{display:block;font-size:clamp(28px,4vw,46px);font-weight:700;color:var(--g);letter-spacing:-.02em;line-height:1.2}
.stats span{color:var(--mu);font-size:15px;font-weight:500}
section{padding:84px 0 0}
h2{font-size:clamp(28px,4.2vw,46px);letter-spacing:-.03em;font-weight:700;margin:0 0 28px;line-height:1.15}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.svc div{background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:6px;min-height:210px}
.svc i{width:52px;height:52px;border-radius:16px;background:var(--gs);display:grid;place-items:center;margin-bottom:auto}
